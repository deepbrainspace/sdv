services:
  comfyui:
    build:
      context: .
      dockerfile: Dockerfile.comfy
    ports:
      - "8188:8188"
    volumes:
      - ${STORAGE_PATH}/models:/models
      - ${STORAGE_PATH}/output:/output
      - ${STORAGE_PATH}/workflows:/workflows
      - ./configs:/configs:ro
    environment:
      - HF_TOKEN=${HF_TOKEN}
      - PYTORCH_CUDA_ALLOC_CONF=max_split_size_mb:512
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    
  audio:
    build:
      context: .
      dockerfile: Dockerfile.audio
    ports:
      - "8080:8080"
    volumes:
      - ${STORAGE_PATH}/output:/output
    environment:
      - HF_TOKEN=${HF_TOKEN}

  compositor:
    build:
      context: .
      dockerfile: Dockerfile.compositor
    volumes:
      - ${STORAGE_PATH}/output:/output
      - ${STORAGE_PATH}/temp:/temp
    environment:
      - PYTHONUNBUFFERED=1
      - TEMP_DIR=/temp